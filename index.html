<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Farmácia Jr. — Totem de Vendas</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2F80ED" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dark:#EAF3FC;
    --paper-white:#FFFFFF;
    --ink:#153350;
    --ink-soft:#5C7A96;
    --stamp:#2F80ED;
    --stamp-dark:#1D63C4;
    --sage:#1F9D6C;
    --sage-bg:#E3F8EE;
    --amber:#C6862A;
    --amber-bg:#FBF0DC;
    --line:#DCEAFA;
    --accent-bg:#EAF3FC;
    --font-display:'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'Courier New', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper-dark);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .hidden{display:none !important;}

  @keyframes fadeInUp{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0;transform:scale(.94);} to{opacity:1;transform:scale(1);} }

  header.app-header{
    background:linear-gradient(120deg, var(--stamp) 0%, var(--stamp-dark) 100%);color:#fff;
    padding:16px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    box-shadow:0 2px 14px rgba(47,128,237,.25);
  }
  header.app-header h1{
    font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:.01em;margin:0;
  }
  header.app-header .sub{font-size:.72rem;opacity:.85;font-family:var(--font-mono);margin-top:2px;}
  header.app-header .stat-label{font-size:.68rem;opacity:.85;text-transform:uppercase;letter-spacing:.08em;text-align:right;}
  header.app-header .stat-value{font-family:var(--font-mono);font-weight:700;font-size:1.25rem;text-align:right;}
  .offline-pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px;margin-top:4px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#7CF2B7;}

  .layout{max-width:1180px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:960px){ .layout{grid-template-columns:1fr 320px;align-items:start;} }

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(21,51,80,.08);}
  .tab-btn{
    display:flex;align-items:center;gap:6px;padding:9px 14px;border:none;
    border-radius:10px;background:transparent;color:var(--ink-soft);
    font-family:var(--font-display);font-weight:700;font-size:.8rem;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .tab-btn:active{transform:scale(.96);}
  .tab-btn.active{background:var(--stamp);color:#fff;box-shadow:0 2px 8px rgba(47,128,237,.35);}
  .panel{background:var(--paper);border-radius:16px;padding:16px;min-height:420px;margin-top:10px;box-shadow:0 1px 4px rgba(21,51,80,.07);animation:fadeInUp .25s ease;}

  .section-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;letter-spacing:.01em;font-size:.95rem;margin-bottom:10px;color:var(--ink);}
  .muted{color:var(--ink-soft);font-size:.82rem;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .card{text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:transform .15s ease, box-shadow .15s ease;animation:fadeInUp .25s ease;}
  .card:not(.disabled):hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(47,128,237,.16);border-color:var(--stamp);}
  .card:not(.disabled):active{transform:translateY(-1px) scale(.98);}
  .card .name{font-weight:700;font-size:.88rem;}
  .card .price{font-family:var(--font-mono);font-size:.85rem;margin-top:4px;color:var(--stamp-dark);font-weight:700;}
  .card .meta{font-size:.68rem;margin-top:4px;color:var(--ink-soft);}
  .card.disabled{opacity:.4;}
  .card-actions{display:flex;gap:4px;margin-top:8px;}

  .btn{border-radius:10px;border:1px solid var(--line);background:#fff;padding:8px 14px;font-size:.82rem;font-weight:700;color:var(--ink);transition:transform .1s ease, box-shadow .15s ease, filter .15s ease;}
  .btn:hover{filter:brightness(.97);}
  .btn:active{transform:scale(.95);}
  .btn-primary{background:var(--stamp);border-color:var(--stamp);color:#fff;box-shadow:0 3px 10px rgba(47,128,237,.3);}
  .btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-sage{background:var(--sage);border-color:var(--sage);color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-sm{padding:6px 10px;font-size:.72rem;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-block{width:100%;}

  .chip{display:inline-flex;align-items:center;padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:.8rem;margin:3px 4px 3px 0;background:#fff;transition:all .15s ease;}
  .chip:active{transform:scale(.95);}
  .chip.selected{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(47,128,237,.3);}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:.74rem;color:var(--ink-soft);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=time],.field select{
    width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:.86rem;background:#fff;transition:border-color .15s ease;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--stamp);}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .row > .field{flex:1;min-width:120px;}

  table{width:100%;border-collapse:collapse;font-size:.84rem;}
  th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  td{padding:8px 8px;border-bottom:1px solid var(--line);}
  .mono{font-family:var(--font-mono);}

  .badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:.68rem;font-weight:700;font-family:var(--font-mono);}
  .badge-sage{background:var(--sage-bg);color:var(--sage);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-stamp{background:var(--accent-bg);color:var(--stamp-dark);}

  .jaleco-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;transition:transform .15s ease;animation:fadeInUp .25s ease;}
  .jaleco-row.atrasado{border-color:#E1544B;background:#FDECEB;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,84,75,.3);}50%{box-shadow:0 0 0 6px rgba(225,84,75,0);}}

  .alert{display:flex;gap:8px;align-items:flex-start;padding:10px 13px;border-radius:12px;font-size:.82rem;margin-bottom:10px;animation:fadeInUp .2s ease;}
  .alert-warning{background:var(--amber-bg);color:var(--amber);}
  .alert-success{background:var(--sage-bg);color:var(--sage);}
  .alert-danger{background:#FDECEB;color:#D8443B;}

  .receipt{
    background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:16px;font-family:var(--font-mono);position:sticky;top:14px;box-shadow:0 4px 18px rgba(21,51,80,.09);
  }
  .receipt .item{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;padding:8px 0;border-bottom:1px solid var(--paper-dark);animation:fadeInUp .2s ease;}
  .receipt .item:last-child{border-bottom:none;}
  .receipt .total-row{display:flex;justify-content:space-between;border-top:2px solid var(--paper-dark);padding-top:10px;margin-top:6px;font-weight:700;}
  .qty-ctrl{display:flex;align-items:center;gap:5px;}
  .qty-ctrl button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--paper-dark);transition:transform .1s ease;}
  .qty-ctrl button:active{transform:scale(.9);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--accent-bg);margin-bottom:12px;}
  .switch{position:relative;width:40px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:22px;transition:.15s;}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--stamp);}
  input:checked + .slider:before{transform:translateX(18px);}

  .modal-overlay{position:fixed;inset:0;background:rgba(21,51,80,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fadeInUp .15s ease;}
  .modal{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(21,51,80,.3);animation:popIn .2s ease;}
  .modal h3{margin:0 0 12px;font-family:var(--font-display);color:var(--ink);}

  .empty-state{text-align:center;padding:50px 20px;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-soft);background:var(--accent-bg);}
  .empty-state .big{font-weight:700;color:var(--ink);margin-top:6px;}

  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--paper-dark);font-size:.86rem;}
  .kv:last-child{border-bottom:none;}
  .kv .v{font-family:var(--font-mono);font-weight:700;color:var(--stamp-dark);}
</style>
</head>

function nowISO(){return new Date().toISOString();}
function todayStr(){return new Date().toISOString().slice(0,10);}
function brl(n){n=Number(n)||0;return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtTime(iso){ if(!iso) return '--:--'; const d=new Date(iso); return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayLocalDateInput(){ const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const def = defaultState();
    // shallow-merge so new fields added in updates don't break old saves
    return Object.assign(def, parsed, {catalog: Object.assign(def.catalog, parsed.catalog||{})});
  }catch(e){
    console.error('Falha ao carregar dados salvos', e);
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Falha ao salvar', e); flashError('Não consegui salvar os dados neste aparelho (armazenamento cheio?).'); }
}
function flashError(msg){ state.uiError = msg; render(); setTimeout(()=>{ state.uiError=''; render(); }, 4000); }
function flashOk(msg){ state.uiOk = msg; render(); setTimeout(()=>{ state.uiOk=''; render(); }, 3000); }

const SUPABASE_URL = 'https://mkdpcaugxhvtkfwqaxdk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rZHBjYXVneGh2dGtmd3FheGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTIyNzEsImV4cCI6MjEwMzQ2ODI3MX0.Dni86LzXc2A5oi5H1a5OpoWJMruwwp8I0M8HujAxEJY';
let online = false;
let syncingQueue = false;

async function sbFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, opts.headers||{});
  const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('sb '+res.status+' '+t); }
  const ct = res.headers.get('content-type')||'';
  if(ct.indexOf('application/json')>=0) return res.json();
  return null;
}

function isOnline(){ return online; }

async function checkConnectivity(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 4000);
    await fetch(SUPABASE_URL+'/rest/v1/', {method:'HEAD', headers:{apikey:SUPABASE_ANON_KEY}, signal: ctrl.signal});
    clearTimeout(timer);
    const wasOffline = !online;
    online = true;
    if(wasOffline){ onConnectivityRestored(); render(); }
  }catch(e){
    const wasOnline = online;
    online = false;
    if(wasOnline) render();
  }
}

async function onConnectivityRestored(){
  // ao voltar a ficar online, primeiro "publica" o estoque local (fonte da verdade enquanto estava offline)
  for(const sv of state.catalog.souvenirs){ await syncUpsertSouvenir(sv); }
  await syncTick();
}

function queueSync(path, method, body, extraHeaders){
  state.syncQueue.push({qid: uid(), path, method, body: body||null, headers: extraHeaders||null});
  saveState();
  flushSyncQueue();
}

async function flushSyncQueue(){
  if(!online || syncingQueue) return;
  syncingQueue = true;
  const tamanhoAntes = state.syncQueue.length;
  const remaining = [];
  for(const item of state.syncQueue){
    try{
      await sbFetch(item.path, {method:item.method, body: item.body? JSON.stringify(item.body): undefined, headers: item.headers||{}});
    }catch(e){
      remaining.push(item);
    }
  }
  state.syncQueue = remaining;
  syncingQueue = false;
  if(remaining.length !== tamanhoAntes){ saveState(); render(); }
}

function categoriaFromSale(sale){
  const tipo = sale.items[0] && sale.items[0].meta && sale.items[0].meta.tipo;
  if(tipo==='acai') return 'Açaí';
  if(tipo==='sude') return 'Sudê';
  if(tipo==='souvenir') return 'Souvenir';
  if(tipo==='impressao') return 'Impressão';
  return 'Outro';
}

function pushVenda(sale){
  queueSync('/rest/v1/vendas', 'POST', {
    id: sale.id, device_name: sale.deviceName, categoria: categoriaFromSale(sale),
    descricao: sale.items.map(i=>`${i.qtd}x ${i.nome}`).join(', '),
    forma_pagamento: sale.formaPagamento, membro: sale.membro, valor: sale.total,
    payload: sale.items
  });
}

function pushJaleco(j){

async function pullEstoque(){
  if(!online) return false;
  try{
    const rows = await sbFetch('/rest/v1/estoque_souvenirs?select=*');
    let changed = false;
    (rows||[]).forEach(r=>{
      const local = state.catalog.souvenirs.find(s=>s.nome===r.nome);
      if(local){
        if(local.estoque!==r.estoque || local.preco!==r.preco || local.descontoMembro!==r.desconto_membro){
          local.estoque=r.estoque; local.preco=r.preco; local.descontoMembro=r.desconto_membro;
          changed = true;
        }
      } else {
        state.catalog.souvenirs.push({id:uid(), nome:r.nome, preco:r.preco, estoque:r.estoque, descontoMembro:r.desconto_membro});
        changed = true;
      }
    });
    if(changed) saveState();
    return changed;
  }catch(e){ return false; }
}
let lastVendaSync = null;
async function pullVendasRecentes(){
  if(!online) return false;
  try{
    const filtro = lastVendaSync ? `&created_at=gt.${encodeURIComponent(lastVendaSync)}` : '';
    const rows = await sbFetch(`/rest/v1/vendas?select=*&order=created_at.asc${filtro}`);
    const idsLocais = new Set(state.sales.map(s=>s.id));
    let changed = false;
    (rows||[]).forEach(r=>{
      lastVendaSync = r.created_at;
      if(idsLocais.has(r.id)) return;
      if(r.device_name === state.deviceName) return; // já é o nosso, não duplica
      state.sales.unshift({
        id:r.id, timestamp:r.created_at, items:r.payload||[{nome:r.descricao,qtd:1,preco:r.valor}],
        total:r.valor, formaPagamento:r.forma_pagamento, membro:r.membro, deviceName:r.device_name, remoto:true
      });
      changed = true;
    });
    if(changed) saveState();
    return changed;
  }catch(e){ return false; }
}
async function pullJalecos(){
  if(!online) return false;
  try{
    const rows = await sbFetch('/rest/v1/jaleco_emprestimos?select=*&status=eq.emprestado');
    let changed = false;
    (rows||[]).forEach(r=>{
      const j = state.jalecos.find(x=>x.numero===r.numero);
      if(j && j.status!=='emprestado' && r.device_name!==state.deviceName){
        j.status='emprestado'; j.emprestimoId=r.id;
        j.current = {nome:r.nome_cliente, telefone:r.telefone, periodo:r.periodo, pagamento:r.pagamento,
          formaPagamento:r.forma_pagamento, horaRetirada:r.hora_retirada, horaPrevista:r.hora_prevista, valor:r.valor};
        changed = true;
      }
    });
    if(changed) saveState();
    return changed;
  }catch(e){ return false; }
}
async function pullPedidos(){
  if(!online) return false;
  try{
    const rows = await sbFetch('/rest/v1/pedidos?select=*');
    const idsLocais = new Set(state.pedidosSouvenir.map(p=>p.id));
    let changed = false;
    (rows||[]).forEach(r=>{
      if(idsLocais.has(r.id)){
        const local = state.pedidosSouvenir.find(p=>p.id===r.id);
        if(local && local.status!==r.status){ local.status = r.status; changed = true; }
        return;
      }
      if(r.device_name===state.deviceName) return;
      state.pedidosSouvenir.push({id:r.id, nome:r.nome_cliente, telefone:r.telefone, itens:r.itens, status:r.status, criadoEm:r.created_at});
      changed = true;
    });
    if(changed) saveState();
    return changed;
  }catch(e){ return false; }
}

  if(!online) return;
  await flushSyncQueue();
  const resultados = await Promise.all([pullEstoque(), pullVendasRecentes(), pullJalecos(), pullPedidos()]);
  if(resultados.some(Boolean)) render();
}

async function finalizarVenda(formaPagamento){
  if(state.cart.length===0) return;
  // check souvenir stock (local)
  for(const item of state.cart){
    if(item.souvenirId){
      const sv = state.catalog.souvenirs.find(s=>s.id===item.souvenirId);
      if(sv && item.qtd>sv.estoque){ flashError(`Estoque insuficiente de "${sv.nome}" (disponível: ${sv.estoque}).`); return; }
    }
  }
  // se online, confirma o estoque de souvenirs no servidor antes de comprometer (evita venda em dobro entre aparelhos)
  if(isOnline()){
    for(const item of state.cart){
      if(item.souvenirId){
        const ok = await syncDecrementEstoque(item.nome, item.qtd);
        if(ok===false){
          flashError(`"${item.nome}" acabou de esgotar em outro aparelho. Atualizando estoque...`);
          pullEstoque(); render();
          return;
        }
        // ok===null (rede caiu no meio) segue no fluxo offline normal abaixo
      }
    }
  }
  // decrement stock local
  state.catalog.souvenirs = state.catalog.souvenirs.map(sv=>{
    const cartItem = state.cart.find(i=>i.souvenirId===sv.id);
    return cartItem ? Object.assign({}, sv, {estoque: sv.estoque - cartItem.qtd}) : sv;
  });
  const sale = {
    id: uid(),
    timestamp: nowISO(),
    items: state.cart.map(i=>({nome:i.nome, qtd:i.qtd, preco:i.preco, meta:i.meta||null})),
    total: cartTotal(),
    formaPagamento,
    membro: state.membroAtivo,
    deviceName: state.deviceName || '(sem nome)'
  };
  state.sales.unshift(sale);
  state.cart = [];
  saveState(); render();
  pushVenda(sale);
  flashOk('Venda finalizada!');
}

function parseCSV(text){
  // simple CSV parser supporting quoted fields and , or ; delimiter
  const delim = text.split('\n')[0].includes(';') ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  const parseLine = (line)=>{
    const out=[]; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQuotes = !inQuotes; continue; }
      if(c===delim && !inQuotes){ out.push(cur); cur=''; continue; }
      cur+=c;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const headers = parseLine(lines[0]).map(h=>h.toLowerCase());
  return lines.slice(1).map(line=>{
    const cols = parseLine(line);
    const row = {};
    headers.forEach((h,i)=> row[h]=cols[i]);
    return row;
  });
}
function findCol(row, candidates){
  for(const c of candidates){ if(row[c]!==undefined) return row[c]; }
  return undefined;
}
function handleSouvenirUpload(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const rows = parseCSV(String(e.target.result));
      if(!rows.length) throw new Error('Planilha vazia.');
      const parsed = rows.map(row=>{
        const nome = findCol(row,['nome','item','produto']);
        const preco = findCol(row,['preco','preço','valor']);
        const estoque = findCol(row,['estoque','quantidade','qtd']);
        const desconto = findCol(row,['desconto membro (%)','desconto','descontomembro','desconto_membro']);
        return {
          id:uid(),
          nome: nome ? String(nome).trim() : '',
          preco: parseFloat(String(preco||'0').replace(',','.'))||0,
          estoque: parseInt(estoque,10)||0,
          descontoMembro: parseFloat(String(desconto||'0').replace(',','.'))||0
        };
      }).filter(r=>r.nome);
      if(!parsed.length) throw new Error('Não encontrei colunas reconhecíveis (Nome, Preço, Estoque).');
      state.catalog.souvenirs = parsed;
      saveState(); render();
      flashOk(parsed.length+' souvenirs carregados.');
    }catch(err){
      flashError(err.message || 'Não consegui ler esse arquivo CSV.');
    }
  };
  reader.readAsText(file, 'UTF-8');
  fileInput.value = '';
}

/* ============================= FECHAMENTO DE CAIXA ============================= */
function salesToday(){ return state.sales.filter(s=>s.timestamp.slice(0,10)===todayStr()); }
function fechamentoResumo(){
  const sales = salesToday();
  const totalSales = sales.reduce((a,s)=>a+s.total,0);
  const porForma = {dinheiro:0, pix:0};
  sales.forEach(s=>{ if(porForma[s.formaPagamento]!==undefined) porForma[s.formaPagamento]+=s.total; });
  let impressoesGratis=0, impressoesPagas=0, arrecadadoImpressao=0;
  sales.forEach(s=> s.items.forEach(it=>{
    if(it.meta && it.meta.tipo==='impressao'){
      if(it.preco===0) impressoesGratis++; else { impressoesPagas++; arrecadadoImpressao+=it.preco*it.qtd; }
    }
  }));
  const jalecosHistoricoHoje = state.jalecoHistorico.filter(h=>(h.horaDevolucaoReal||'').slice(0,10)===todayStr());
  const jalecosPagosHoje = jalecosHistoricoHoje.filter(h=>h.pago);
  const arrecadadoJaleco = jalecosPagosHoje.reduce((a,h)=>a+(h.valor||0),0);
  jalecosPagosHoje.forEach(h=>{ if(porForma[h.formaPagamento]!==undefined) porForma[h.formaPagamento]+=(h.valor||0); });
  const totalGeral = totalSales + arrecadadoJaleco;
  const pedidosPendentes = state.pedidosSouvenir.filter(p=>p.status==='pendente').length;
  return {totalGeral, porForma, impressoesGratis, impressoesPagas, arrecadadoImpressao, arrecadadoJaleco, jalecosDevolvidosHoje: jalecosHistoricoHoje.length, jalecosPagosHoje: jalecosPagosHoje.length, pedidosPendentes};
}
function downloadCSVFechamento(){
  const sales = salesToday();
  const rows = [['Data','Descrição','Categoria','Forma de Pagamento','Valor']];
  sales.forEach(s=>{
    const data = new Date(s.timestamp).toLocaleDateString('pt-BR');
    s.items.forEach(it=>{
      const categoria = (it.meta&&it.meta.tipo) || 'venda';
      rows.push([data, `${it.nome} x${it.qtd}`, categoria, s.formaPagamento, (it.preco*it.qtd).toFixed(2)]);
    });
  });
  state.jalecoHistorico.filter(h=>(h.horaDevolucaoReal||'').slice(0,10)===todayStr() && h.pago).forEach(h=>{
    const data = new Date(h.horaDevolucaoReal).toLocaleDateString('pt-BR');
    rows.push([data, `Jaleco #${h.jalecoNumero} - ${h.nome}`, 'jaleco', h.formaPagamento, (h.valor||0).toFixed(2)]);
  });
  // vírgula como separador (padrão CSV/RFC 4180, o que pandas e a maioria
  // dos importadores esperam por padrão sem precisar de configuração extra)
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fechamento_caixa_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (state.deviceName||'aparelho').replace(/[^a-z0-9]/gi,'_');
  a.href = url; a.download = `backup_totem_${safeName}_${todayStr()}_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const incoming = JSON.parse(String(e.target.result));
      const existingSaleIds = new Set(state.sales.map(s=>s.id));
      const newSales = (incoming.sales||[]).filter(s=>!existingSaleIds.has(s.id));
      state.sales = newSales.concat(state.sales).sort((a,b)=> b.timestamp.localeCompare(a.timestamp));

      const existingHistIds = new Set(state.jalecoHistorico.map(h=>h.id));
      const newHist = (incoming.jalecoHistorico||[]).filter(h=>!existingHistIds.has(h.id));
      state.jalecoHistorico = newHist.concat(state.jalecoHistorico);

      const existingPedIds = new Set(state.pedidosSouvenir.map(p=>p.id));
      const newPed = (incoming.pedidosSouvenir||[]).filter(p=>!existingPedIds.has(p.id));
      state.pedidosSouvenir = newPed.concat(state.pedidosSouvenir);

      saveState(); render();
      flashOk(`Importado: +${newSales.length} vendas, +${newHist.length} histórico de jaleco, +${newPed.length} encomendas.`);
    }catch(err){
      flashError('Não consegui ler esse arquivo de backup.');
    }
  };
  reader.readAsText(file, 'UTF-8');
  fileInput.value = '';
}

function renderEditableList(items, removeAction, showPrice){
  if(items.length===0) return `<div class="muted" style="margin-bottom:8px;">Nenhum item.</div>`;
  return `<div style="margin-bottom:8px;">${items.map(i=>`
    <span class="chip">${escapeHtml(i.nome)}${showPrice? ' · '+brl(i.preco):''}
      <button data-action="removeGeneric" data-fn="${removeAction}" data-id="${i.id}" style="border:none;background:none;color:var(--stamp);margin-left:6px;cursor:pointer;">✕</button>
    </span>`).join('')}</div>`;
}

/* ============================= RENDER: PEDIDOS ============================= */
function renderPedidos(){
  let html = `<div class="section-title">📝 Encomendas de souvenir</div>`;
  html += `<button class="btn btn-primary" style="margin-bottom:14px;" data-action="openPedido">+ Nova encomenda</button>`;
  html += `<div class="row" style="margin-bottom:12px;">
    <button class="btn ${state.pedidosFiltro==='pendentes'?'btn-dark':''}" data-action="setPedidosFiltro" data-f="pendentes">Pendentes (${state.pedidosSouvenir.filter(p=>p.status==='pendente').length})</button>
    <button class="btn ${state.pedidosFiltro==='retirados'?'btn-dark':''}" data-action="setPedidosFiltro" data-f="retirados">Retirados (${state.pedidosSouvenir.filter(p=>p.status==='retirado').length})</button>
  </div>`;
  const lista = state.pedidosSouvenir.filter(p=> state.pedidosFiltro==='pendentes' ? p.status==='pendente' : p.status==='retirado');
  if(lista.length===0){
    html += `<div class="empty-state">Nenhuma encomenda ${state.pedidosFiltro==='pendentes'?'pendente':'retirada'}.</div>`;
  } else {
    html += lista.map(p=>`<div class="jaleco-row">
      <div>
        <div style="font-weight:700;">${escapeHtml(p.nome)} <span class="muted" style="font-weight:400;">${escapeHtml(p.telefone||'')}</span></div>
        <div class="muted" style="font-size:.78rem;">${p.itens.map(i=>`${i.qtd}x ${escapeHtml(i.nome)}`).join(', ')} · ${brl(p.total)}</div>
        <div class="muted" style="font-size:.72rem;">Pedido em ${fmtDateTime(p.criadoEm)} ${p.retiradoEm? '· Retirado em '+fmtDateTime(p.retiradoEm):''}</div>
      </div>
      ${p.status==='pendente'? `<button class="btn btn-sm btn-sage" data-action="retirarPedido" data-id="${p.id}">Marcar como retirado</button>` :
        `<span class="badge badge-sage">${p.pago?'Pago':'Não pago'}</span>`}
    </div>`).join('');
  }
  return html;
}

/* ============================= RENDER: FECHAMENTO ============================= */

  html += `<div class="kv"><span>Impressões grátis (membros)</span><span class="v">${r.impressoesGratis}</span></div>`;
  html += `<div class="kv"><span>Impressões pagas (externos)</span><span class="v">${r.impressoesPagas} · ${brl(r.arrecadadoImpressao)}</span></div>`;
  html += `<div class="kv"><span>Jalecos devolvidos hoje</span><span class="v">${r.jalecosDevolvidosHoje}</span></div>`;
  html += `<div class="kv"><span>Jalecos pagos hoje</span><span class="v">${r.jalecosPagosHoje} · ${brl(r.arrecadadoJaleco)}</span></div>`;

  html += `<div class="section-title" style="margin-top:26px;">💾 Backup deste aparelho</div>`;

  html += `<div class="field" style="max-width:260px;"><label>Nome deste aparelho</label><input type="text" id="deviceNameInput" value="${escapeHtml(state.deviceName)}" placeholder="Ex: Caixa 1 - celular ICB" data-action-change="setDeviceName"></div>`;
  html += `<div class="field" style="max-width:300px;"><label>Este aparelho é responsável por</label>
    <select data-action-change="setResponsabilidade">
      <option value="" ${!state.responsabilidade?'selected':''}>Não definido</option>
      <option value="Açaí & Sudê" ${state.responsabilidade==='Açaí & Sudê'?'selected':''}>Açaí & Sudê</option>
      <option value="Souvenirs" ${state.responsabilidade==='Souvenirs'?'selected':''}>Souvenirs</option>
      <option value="Jaleco" ${state.responsabilidade==='Jaleco'?'selected':''}>Jaleco</option>
      <option value="Impressão" ${state.responsabilidade==='Impressão'?'selected':''}>Impressão</option>
      <option value="Tudo (aparelho único)" ${state.responsabilidade==='Tudo (aparelho único)'?'selected':''}>Tudo (aparelho único)</option>
    </select>
  </div>`;
  html += `<div style="margin-top:10px;font-size:.82rem;opacity:.75;max-width:420px;">
    ${online ? '🟢 Este aparelho está online — vendas, estoque de souvenirs, jalecos e encomendas sincronizam automaticamente com os outros aparelhos online.' : '⚪ Este aparelho está offline — tudo funciona normalmente aqui, e sincroniza sozinho quando a internet voltar.'}
  </div>`;
  html += `<div class="row" style="margin-top:10px;">
    <button class="btn btn-dark" data-action="exportBackupBtn">⬇ Exportar backup (.json)</button>
    <label class="btn" style="display:inline-flex;align-items:center;">⬆ Importar backup<input type="file" accept=".json" style="display:none" data-action-change="importBackupBtn"></label>
  </div>`;
  return html;
}

/* ============================= MODALS ============================= */

  if(type==='emprestimo'){
    inner = `<h3>Emprestar jaleco</h3>
      <div class="muted" style="margin-bottom:10px;">Valor do empréstimo: <b>${brl(state.catalog.jalecoPreco||0)}</b></div>
      <div class="field"><label>Nome</label><input type="text" id="m_nome"></div>
      <div class="field"><label>Telefone</label><input type="tel" id="m_telefone"></div>
      <div class="field"><label>Período</label><input type="text" id="m_periodo" placeholder="Ex: 5º período"></div>
      <div class="row">
        <div class="field"><label>Pagamento</label><select id="m_pagamento"><option value="antecipado">Pago antecipado</option><option value="na_devolucao">Vai pagar na devolução</option></select></div>
        <div class="field"><label>Forma</label><select id="m_forma"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label>Horário retirada</label><input type="datetime-local" id="m_retirada" value="${todayLocalDateInput()}"></div>
        <div class="field"><label>Previsão devolução</label><input type="datetime-local" id="m_previsao"></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-ghost" data-action="closeModalBtn">Cancelar</button>
        <button class="btn btn-primary" data-action="confirmEmprestimo" data-id="${payload.jalecoId}">Confirmar empréstimo</button>
      </div>`;
  } else if(type==='confirmarPagamentoJaleco'){
    const jl = state.jalecos.find(x=>x.id===payload.jalecoId);
    const valorDevido = jl && jl.current ? jl.current.valor : state.catalog.jalecoPreco;
    inner = `<h3>Pagamento recebido?</h3>
      <div class="muted" style="margin-bottom:14px;">Esse jaleco estava marcado como "vai pagar na devolução". Confirme que o pagamento de <b>${brl(valorDevido||0)}</b> foi recebido antes de encerrar.</div>
      <div class="row">
        <button class="btn btn-ghost" data-action="closeModalBtn">Cancelar</button>
        <button class="btn btn-sage" data-action="confirmarDevolucaoPaga" data-id="${payload.jalecoId}">✓ Pagamento recebido</button>
      </div>`;
  } else if(type==='confirmarPagamentoPedido'){
    inner = `<h3>Pagamento recebido?</h3>
      <div class="muted" style="margin-bottom:14px;">Essa encomenda estava marcada como "vai pagar na retirada". Confirme o pagamento antes de entregar.</div>
      <div class="row">
        <button class="btn btn-ghost" data-action="closeModalBtn">Cancelar</button>
        <button class="btn btn-sage" data-action="confirmarPedidoPago" data-id="${payload.pedidoId}">✓ Pagamento recebido</button>
      </div>`;
  } else if(type==='pedido'){
    const souvenirs = state.catalog.souvenirs;
    inner = `<h3>Nova encomenda</h3>
      <div class="field"><label>Nome do comprador</label><input type="text" id="p_nome"></div>
      <div class="field"><label>Telefone</label><input type="tel" id="p_telefone"></div>
      <div class="field"><label>Item</label>
        <select id="p_item">${souvenirs.map(s=>`<option value="${s.id}" ${payload.souvenirId===s.id?'selected':''}>${escapeHtml(s.nome)} — ${brl(s.preco)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Quantidade</label><input type="number" id="p_qtd" min="1" value="1"></div>
      <div class="row">
        <div class="field"><label>Pagamento</label><select id="p_pagamento"><option value="antecipado">Pago antecipado</option><option value="na_retirada">Vai pagar na retirada</option></select></div>
        <div class="field"><label>Forma</label><select id="p_forma"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option></select></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-ghost" data-action="closeModalBtn">Cancelar</button>
        <button class="btn btn-primary" data-action="confirmPedido">Registrar encomenda</button>
      </div>`;
  }
  return `<div class="modal-overlay" data-action="overlayClick"><div class="modal" onclick="event.stopPropagation()">${inner}</div></div>`;
}

/* ============================= EVENT BINDING ============================= */
function bindGlobalEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const action = el.getAttribute('data-action');
      handleAction(action, el, e);
    };
  });
  document.querySelectorAll('[data-action-change]').forEach(el=>{
    el.onchange = (e)=>{
      const action = el.getAttribute('data-action-change');
      handleChangeAction(action, el, e);
    };
  });
  // device name first-run prompt
  if(!state.deviceName){
    const nome = prompt('Primeiro uso neste aparelho — dá um nome pra ele (ex: "Caixa 1 - celular ICB"):');
    if(nome){ state.deviceName = nome.trim(); saveState(); render(); }
  }
}

function handleAction(action, el, e){
  const id = el.getAttribute('data-id');
  switch(action){
    case 'setTab': setTab(el.getAttribute('data-tab')); break;
    case 'tentarDesbloquearEstoque': tentarDesbloquearEstoque(); break;
    case 'selectTamanho': selectTamanho(id); break;
    case 'toggleAdicional': toggleAdicional(id); break;
    case 'addAcai': addAcaiToCart(); break;
    case 'selectSabor': selectSabor(id); break;
    case 'addSude': addSudeToCart(); break;
    case 'comprarSouvenir': comprarSouvenirAgora(id); break;
    case 'openPedido': openModal('pedido', {souvenirId:id||null}); break;
    case 'addJalecoBtn': {
      const numero = document.getElementById('novoJalecoNumero').value.trim();
      const tamanho = document.getElementById('novoJalecoTamanho').value.trim();
      addJaleco(numero, tamanho);
      break;
    }
    case 'removeJalecoBtn': removeJaleco(id); break;
    case 'openEmprestimo': openModal('emprestimo', {jalecoId:id}); break;
    case 'devolverJaleco': iniciarDevolucao(id); break;
    case 'toggleHistoricoJaleco': state.jalecoHistoricoAberto = !state.jalecoHistoricoAberto; render(); break;
    case 'setTipoImpressao': window.__tipoImpressao = el.getAttribute('data-tipo'); render(); break;
    case 'addImpressaoBtn': {
      const paginas = document.getElementById('paginasImpressao').value;
      const tipo = window.__tipoImpressao || 'pb';
      const nomeEl = document.getElementById('nomeExternoImpressao');
      addImpressaoToCart(paginas, tipo, nomeEl? nomeEl.value.trim() : null);
      break;
    }
    case 'addTamanhoBtn': {
      const nome = document.getElementById('novoTamanhoNome').value.trim();
      const preco = document.getElementById('novoTamanhoPreco').value;
      addTamanhoAcai(nome, preco);
      break;
    }
    case 'removeGeneric': {
      const fn = el.getAttribute('data-fn');
      window[fn](id);
      break;
    }
    case 'addAdicionalBtn': {
      const nome = document.getElementById('novoAdicionalNome').value.trim();
      const preco = document.getElementById('novoAdicionalPreco').value;
      addAdicionalAcai(nome, preco);
      break;
    }
    case 'addSaborBtn': {
      const nome = document.getElementById('novoSaborNome').value.trim();
      addSaborSude(nome);
      break;
    }
    case 'adjustEstoque': adjustSouvenirEstoque(id, parseInt(el.getAttribute('data-delta'),10)); break;
    case 'removeSouvenirBtn': removeSouvenir(id); break;
    case 'addSouvenirBtn': {
      const nome = document.getElementById('novoSouvenirNome').value.trim();
      const preco = document.getElementById('novoSouvenirPreco').value;
      const estoque = document.getElementById('novoSouvenirEstoque').value;
      const desconto = document.getElementById('novoSouvenirDesconto').value;
      addSouvenirManual(nome, preco, estoque, desconto);
      break;
    }
    case 'setPedidosFiltro': state.pedidosFiltro = el.getAttribute('data-f'); render(); break;
    case 'retirarPedido': iniciarRetirada(id); break;
    case 'downloadCSV': downloadCSVFechamento(); break;
    case 'exportBackupBtn': exportBackup(); break;
    case 'cartQty': changeCartQty(id, parseInt(el.getAttribute('data-delta'),10)); break;
    case 'cartRemove': removeFromCart(id); break;
    case 'finalizar': finalizarVenda(el.getAttribute('data-forma')); break;
    case 'closeModalBtn': closeModal(); break;
    case 'overlayClick': if(e.target===el) closeModal(); break;
    case 'confirmEmprestimo': {
      const data = {
        nome: document.getElementById('m_nome').value.trim(),
        telefone: document.getElementById('m_telefone').value.trim(),
        periodo: document.getElementById('m_periodo').value.trim(),
        pagamento: document.getElementById('m_pagamento').value,
        formaPagamento: document.getElementById('m_forma').value,
        horaRetirada: document.getElementById('m_retirada').value ? new Date(document.getElementById('m_retirada').value).toISOString() : nowISO(),
        horaPrevista: document.getElementById('m_previsao').value ? new Date(document.getElementById('m_previsao').value).toISOString() : ''
      };
      submitEmprestimo(id, data);
      break;
    }
    case 'confirmarDevolucaoPaga': concluirDevolucao(id, true); break;
    case 'confirmarPedidoPago': concluirRetirada(id, true); break;
    case 'confirmPedido': {
      const souvenirId = document.getElementById('p_item').value;
      const sv = state.catalog.souvenirs.find(s=>s.id===souvenirId);
      const qtd = Math.max(1, parseInt(document.getElementById('p_qtd').value,10)||1);
      const data = {
        nome: document.getElementById('p_nome').value.trim(),
        telefone: document.getElementById('p_telefone').value.trim(),
        itens: sv? [{souvenirId:sv.id, nome:sv.nome, qtd, precoUnit:sv.preco}] : [],
        pagamento: document.getElementById('p_pagamento').value,
        formaPagamento: document.getElementById('p_forma').value
      };
      submitPedido(data);
      break;
    }
  }
}

function handleChangeAction(action, el){
  const id = el.getAttribute('data-id');
  switch(action){
    case 'updateSudePreco': updateSudePreco(el.value); break;
    case 'updateImpressaoColorido': updateImpressaoPreco('colorido', el.value); break;
    case 'updateImpressaoPB': updateImpressaoPreco('pb', el.value); break;
    case 'updateJalecoPreco': updateJalecoPreco(el.value); break;
    case 'updateEstoqueSenha': updateEstoqueSenha(el.value); break;
    case 'updateSouvenirPreco': updateSouvenirField(id, 'preco', el.value); break;
    case 'updateSouvenirDesconto': updateSouvenirField(id, 'descontoMembro', el.value); break;
    case 'uploadSouvenirCsv': handleSouvenirUpload(el); break;
    case 'toggleMembroBtn': toggleMembro(); break;
    case 'setDeviceName': state.deviceName = el.value.trim(); saveState(); render(); break;
    case 'setResponsabilidade': state.responsabilidade = el.value; saveState(); render(); break;
    case 'exportBackupBtn': exportBackup(); break;
    case 'importBackupBtn': importBackup(el); break;
  }
}

/* ============================= INIT ============================= */
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.error('SW falhou:', err));
  });
}
</script>
